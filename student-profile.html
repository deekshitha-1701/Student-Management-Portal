```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        background:
        linear-gradient(
            rgba(0,0,0,0.55),
            rgba(0,0,0,0.55)
        ),
        url('images/back.jpg');

        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
    }

    /* Navbar */

    .navbar{
        background: rgba(33,37,41,0.85)!important;
        backdrop-filter: blur(10px);
    }

    /* Profile Card */

    .profile-card{
        max-width: 500px;
        margin: auto;

        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(15px);

        border-radius: 25px;

        border: 1px solid rgba(255,255,255,0.2);

        box-shadow: 0 10px 30px rgba(0,0,0,0.3);

        color: white;

        transition: 0.4s;
    }

    .profile-card:hover{
        transform: translateY(-5px);
    }

    /* Profile Image */

    .profile-img{
        width: 170px;
        height: 170px;

        object-fit: cover;

        border-radius: 50%;

        border: 5px solid white;

        box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .student-name{
        font-weight: bold;
        margin-top: 15px;
    }

    .profile-info{
        font-size: 17px;
        margin-bottom: 10px;
    }

    .btn-edit{
        width: 100%;
        padding: 10px;
        font-size: 18px;
        border-radius: 10px;
    }

    /* Dark Mode */

    .dark-mode{
        background: #121212 !important;
        color: white;
    }

    .dark-mode .profile-card{
        background: rgba(30,30,30,0.8);
    }

    @media(max-width:768px){

        .profile-card{
            margin: 20px;
        }

        .profile-img{
            width: 140px;
            height: 140px;
        }
    }

</style>
```

</head>
